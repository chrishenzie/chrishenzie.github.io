# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
#
# Build with `make resume` from the repo root. Output lands in static/resume.pdf,
# which Hugo serves at /resume.pdf.
#
# Roles use `highlights` rather than `summary` so the whole document is bulleted;
# mixing the two reads as inconsistent. Sunrun carries no highlights at all: the
# entry earns its line by anchoring the start of the career, and the one bullet
# it had said nothing a reader could use.

cv:
  name: Chris Henzie
  headline:
    containerd reviewer and security advisor · Senior Software Engineer at
    Google
  location: Sunnyvale, CA
  email: chrishenzie@gmail.com
  website: https://chrishenzie.com
  # Spelled out as custom connections so the displayed text stays short enough to
  # keep the header on one line.
  custom_connections:
    - placeholder: github.com/chrishenzie
      url: https://github.com/chrishenzie
      fontawesome_icon: github
    - placeholder: in/chrishenzie
      url: https://linkedin.com/in/chrishenzie
      fontawesome_icon: linkedin

  sections:
    Open Source:
      - name: "[containerd](https://containerd.io)"
        start_date: 2024-08
        end_date: present
        highlights:
          - "[Reviewer and security
            advisor](https://github.com/containerd/.project/blob/main/MAINTAINERS)
            for the container runtime under GKE, EKS, AKS, and Docker, a CNCF
            graduated project."
          - Triage vulnerability reports and land the fixes that hold up.
            Prepare releases and backport fixes across supported branches.
      - name: "[Kubernetes](https://kubernetes.io)"
        start_date: 2020-08
        end_date: present
        highlights:
          - "SIG-Storage: authored
            [KEP-2485](https://github.com/kubernetes/enhancements/issues/2485),
            the ReadWriteOncePod access mode, restricting a volume to one pod
            where ReadWriteOnce restricts only to one node. Alpha in 1.22
            through stable in 1.29, with the
            [alpha](https://kubernetes.io/blog/2021/09/13/read-write-once-pod-access-mode-alpha/),
            [beta](https://kubernetes.io/blog/2023/04/20/read-write-once-pod-access-mode-beta/),
            and
            [stable](https://kubernetes.io/blog/2023/12/18/read-write-once-pod-access-mode-ga/)
            announcements on kubernetes.io."
          - "SIG-Node: co-author of
            [KEP-5474](https://github.com/kubernetes/enhancements/issues/5474),
            writable cgroups, which lets AI/ML frameworks like
            [Ray](https://ray.io) set resource limits on their child processes
            without running as privileged. Built the GKE implementation as an
            [NRI plugin](https://github.com/containerd/nri/pull/269), shipped it
            to customers ahead of upstream, and upstreamed the plugin."

    Experience:
      - company: Google
        position: Senior Software Engineer, Google Cloud
        start_date: 2025-10
        end_date: present
        location: Sunnyvale, CA
        highlights:
          - "Kubernetes node and container runtime for GKE. Driving the
            containerd [Node Resource
            Interface](https://github.com/containerd/nri) to 1.0, the plugin API
            that writable cgroups and other node-level resource controls are
            built on."
          - Established a shared maintenance model for containerd at Google, so
            the teams that depend on it land their own features, fixes, and
            releases. Co-organized the 2026 containerd Maintainer Summit.
      - company: Google
        position: Software Engineer, Google Cloud
        start_date: 2024-02
        end_date: 2025-10
        location: Sunnyvale, CA
        highlights:
          - Led GKE's migration to containerd 2.0, which removed support for the
            deprecated CRI v1alpha2 API, Docker Schema 1 images, and certain
            registry config fields.
          - Built the detection path, from a check on the node to a
            recommendation in the customer's console. Every cluster reaching
            Kubernetes 1.33 passes through it, and the ones it flags have their
            automatic upgrades paused until they migrate off.
          - For customers who could not identify the workload still calling the
            deprecated API, published an [eBPF socket
            tracer](https://github.com/GoogleCloudPlatform/k8s-node-tools/tree/master/containerd/socket-tracer)
            resolving the calls back to the container, which also flagged
            widely used observability and security agents needing updates.
          - Coordinated every dependent first-party GKE service onto a shared
            library negotiating the CRI version, with each team's release
            landing before the 1.33 cutoff. Drove remediation with affected
            customers and third-party vendors.
      - company: Google
        position: Software Engineer, YouTube
        start_date: 2023-03
        end_date: 2024-02
        location: San Bruno, CA
        highlights:
          - Machine learning serving infrastructure for YouTube Discovery.
            Evaluated alternative model-serving runtimes across recommendation
            model families for compute efficiency, and added per-model
            authorization to serving RPCs.
      - company: Google
        position: Software Engineer, Google Cloud
        start_date: 2020-05
        end_date: 2023-03
        location: Sunnyvale, CA
        highlights:
          - "Kubernetes storage for Anthos Multi-Cloud on AWS. Maintained the
            upstream [CSI sidecars](https://github.com/kubernetes-csi) and the
            AWS EBS and EFS drivers."
          - Wrote the Kubernetes controllers that provisioned the NetApp
            appliances backing storage on Google Distributed Cloud air-gapped.
      - company: Meta
        position: Software Engineer
        start_date: 2018-04
        end_date: 2020-05
        location: San Francisco Bay Area
        highlights:
          - "[Twine](https://engineering.fb.com/2020/11/11/data-center-engineering/twine-2/),
            Meta's cluster manager and container platform. Built the log reader,
            a C++ service that streams and decompresses container logs on read
            and became the sole path for fleet-wide container log queries."
      - company: Twitch
        position: DevOps Engineer
        start_date: 2016-01
        end_date: 2018-04
        location: San Francisco, CA
        highlights:
          - "Built continuous deployment for the live video CDN: repo metadata
            to a Terraform-provisioned ECS service in under four minutes."
      - company: Sunrun
        position: Software Engineer, then DevOps Engineer
        start_date: 2013-05
        end_date: 2015-12
        location: San Francisco, CA

    Skills:
      - label: Languages
        details: Go, Python, Bash, C++
      - label: Systems
        details:
          Kubernetes, CRI, NRI, containerd, runc, OCI runtime spec, Linux
          containers (cgroups, namespaces)

    Education:
      - institution: University of California, Berkeley
        area: Electrical Engineering and Computer Science
        degree: BS
        start_date: 2009-08
        end_date: 2013-08
        location: Berkeley, CA

design:
  theme: engineeringresumes
  # The theme paints every link black and turns underlines on. Links are the
  # point of this document, so they get the same accent as in-prose links on
  # chrishenzie.com instead.
  colors:
    links: rgb(47,93,74)
  page:
    size: us-letter
    top_margin: 0.45in
    bottom_margin: 0.45in
    left_margin: 0.5in
    right_margin: 0.5in
    show_footer: false
    show_top_note: false
  # Measured 2026-07-27: with the tightened spacing below there are about four
  # spare lines at 9.2pt. 9.6pt does not fit, so the next size up costs more
  # than the spacing reclaimed. Drop leading before size if it gets tight again.
  #
  # `justified` is the theme default and produces the same line breaks as `left`
  # here, so left alignment costs nothing and only removes the stretched word
  # spacing that justification was adding at this measure.
  typography:
    alignment: left
    line_spacing: 0.44em
    font_size:
      body: 9.2pt
      connections: 8.8pt
  # Theme defaults are 0.5cm/0.3cm and 1.2em. Tightening them is where the spare
  # lines came from; the type was already as small as it should go.
  section_titles:
    space_above: 0.3cm
    space_below: 0.2cm
  sections:
    space_between_regular_entries: 0.9em
  header:
    alignment: left
  links:
    underline: true
